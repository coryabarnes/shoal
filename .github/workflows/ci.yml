name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    # Fedora ships gtk4-layer-shell; build where Shoal is developed.
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc rust cargo clippy rustfmt gtk4-devel gtk4-layer-shell-devel

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora44-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: fedora44-cargo-

      - name: Formatting
        run: cargo fmt --check

      - name: Lints (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shoal-linux-x86_64
          path: target/release/shoal
